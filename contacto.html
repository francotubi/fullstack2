<!DOCTYPE html>
<html lang="es">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <title>
            Contacto - DeliveryApp
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styles/style.css">
        <script src="scripts/auth.js">
        </script>
        <script src="scripts/productos-store.js">
        </script>
    </head>
    <body class="d-flex flex-column min-vh-100 bg-light">
        <nav aria-label="Navegación principal" class="navbar navbar-expand-lg navbar-dark bg-danger">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">
                    🍔 DeliveryApp
                </a>
                <button class="navbar-toggler" type="button" aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menú de navegación">
                    <span class="navbar-toggler-icon">
                    </span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                Home
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="productos.html">
                                Productos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="nosotros.html">
                                Nosotros
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="blog.html">
                                Blogs
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="contacto.html">
                                Contacto
                            </a>
                        </li>
                    </ul>
                    <div class="d-flex gap-2 flex-wrap">
                        <a href="login.html" class="btn btn-outline-light">
                            Iniciar Sesión
                        </a>
                        <a href="registro.html" class="btn btn-outline-light">
                            Crear cuenta
                        </a>
                        <a href="carrito.html" class="btn btn-light text-danger fw-bold">
                            🛒 (
                            <span id="cart-count">
                                0
                            </span>
                            )
                        </a>
                    </div>
                </div>
            </div>
        </nav>
        <main class="flex-grow-1 container d-flex justify-content-center align-items-center py-5">
            <div class="card shadow p-4" style="width: 100%; max-width: 500px;">
                <h2 class="text-center mb-4 fw-bold">
                    Contáctanos
                </h2>
                <form id="form-contacto" novalidate>
                    <div class="mb-3">
                        <label for="nombre-cont" class="form-label">
                            Nombre
                        </label>
                        <input type="text" id="nombre-cont" aria-describedby="error-nombre-cont" class="form-control" placeholder="Nombre (Max 100)" required>
                        <div id="error-nombre-cont" class="invalid-feedback" aria-live="polite">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="correo-cont" class="form-label">
                            Correo electrónico
                        </label>
                        <input type="email" id="correo-cont" aria-describedby="error-correo-cont" class="form-control" placeholder="Correo (@duoc.cl, @gmail.com)" required>
                        <div id="error-correo-cont" class="invalid-feedback" aria-live="polite">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="comentario" class="form-label">
                            Mensaje
                        </label>
                        <textarea id="comentario" aria-describedby="error-comentario" class="form-control" placeholder="Tu mensaje aquí (Max 500)" rows="4" required>
                        </textarea>
                        <div id="error-comentario" class="invalid-feedback" aria-live="polite">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-danger w-100 fw-bold">
                        Enviar Mensaje
                    </button>
                    <div id="estado-contacto" role="status" class="mt-3">
                    </div>
                </form>
            </div>
        </main>
        <footer class="bg-dark text-white text-center py-3">
            <p class="mb-0">
                &copy;
                2024 DeliveryApp
            </p>
        </footer>
        <script src="scripts/formularios.js">
        </script>
        <script src="scripts/contacto.js">
        </script>
        <script src="scripts/navegacion.js">
        </script>
    </body>
</html>
