<!DOCTYPE html>
<html lang="es">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <title>
            Login - DeliveryApp
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styles/style.css">
        <script src="scripts/auth.js">
        </script>
        <script src="scripts/productos-store.js">
        </script>
    </head>
    <body class="bg-light">
        <nav aria-label="Navegación principal" class="navbar navbar-expand-lg navbar-dark bg-danger">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">
                    🍔 DeliveryApp
                </a>
                <button class="navbar-toggler" type="button" aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menú de navegación">
                    <span class="navbar-toggler-icon">
                    </span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                Home
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="productos.html">
                                Productos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="nosotros.html">
                                Nosotros
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="blog.html">
                                Blogs
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contacto.html">
                                Contacto
                            </a>
                        </li>
                    </ul>
                    <div class="d-flex gap-2 flex-wrap">
                        <a href="login.html" class="btn btn-outline-light">
                            Iniciar Sesión
                        </a>
                        <a href="registro.html" class="btn btn-outline-light">
                            Crear cuenta
                        </a>
                        <a href="carrito.html" class="btn btn-light text-danger fw-bold">
                            🛒 (
                            <span id="cart-count">
                                0
                            </span>
                            )
                        </a>
                    </div>
                </div>
            </div>
        </nav>
        <main class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
            <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
                <h2 class="text-center mb-4 fw-bold">
                    Iniciar Sesión
                </h2>
                <form id="form-login" novalidate>
                    <div class="mb-3">
                        <label for="correo" class="form-label">
                            Correo Electrónico:
                        </label>
                        <input type="email" id="correo" required maxlength="100" autocomplete="email" aria-describedby="error-correo" class="form-control" placeholder="ejemplo@duoc.cl">
                        <div id="error-correo" class="text-danger small mt-1" style="display: none;">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">
                            Contraseña:
                        </label>
                        <input type="password" id="password" required minlength="4" maxlength="10" autocomplete="current-password" aria-describedby="error-password" class="form-control">
                        <div id="error-password" class="text-danger small mt-1" style="display: none;">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-danger w-100 fw-bold py-2">
                        Ingresar
                    </button>
                    <div id="estado-login" role="status" class="mt-3">
                    </div>
                </form>
                <p class="text-center mt-3">
                    ¿No tienes cuenta?
                    <a href="registro.html">
                        Crear cuenta
                    </a>
                </p>
            </div>
        </main>
        <script src="scripts/login.js">
        </script>
        <script src="scripts/navegacion.js">
        </script>
    </body>
</html>
