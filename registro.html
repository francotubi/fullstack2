<!DOCTYPE html>
<html lang="es">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <title>
            Registro - DeliveryApp
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styles/style.css">
        <script src="scripts/auth.js">
        </script>
        <script src="scripts/productos-store.js">
        </script>
    </head>
    <body class="bg-light">
        <nav aria-label="Navegación principal" class="navbar navbar-expand-lg navbar-dark bg-danger">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">
                    🍔 DeliveryApp
                </a>
                <button class="navbar-toggler" type="button" aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menú de navegación">
                    <span class="navbar-toggler-icon">
                    </span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                Home
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="productos.html">
                                Productos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="nosotros.html">
                                Nosotros
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="blog.html">
                                Blogs
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contacto.html">
                                Contacto
                            </a>
                        </li>
                    </ul>
                    <div class="d-flex gap-2 flex-wrap">
                        <a href="login.html" class="btn btn-outline-light">
                            Iniciar Sesión
                        </a>
                        <a href="registro.html" class="btn btn-outline-light">
                            Crear cuenta
                        </a>
                        <a href="carrito.html" class="btn btn-light text-danger fw-bold">
                            🛒 (
                            <span id="cart-count">
                                0
                            </span>
                            )
                        </a>
                    </div>
                </div>
            </div>
        </nav>
        <main class="container d-flex justify-content-center align-items-center py-5">
            <div class="card shadow p-4" style="width: 100%; max-width: 500px;">
                <h2 class="text-center mb-4 fw-bold">
                    Registro de Usuario
                </h2>
                <form id="form-registro" novalidate>
                    <div class="mb-3">
                        <label for="nombre" class="form-label">
                            Nombre completo
                        </label>
                        <input id="nombre" name="nombre" type="text" class="form-control" required maxlength="150" autocomplete="name" aria-describedby="error-nombre">
                        <div id="error-nombre" class="invalid-feedback" aria-live="polite">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="correo-reg" class="form-label">
                            Correo electrónico
                        </label>
                        <input id="correo-reg" name="correo-reg" type="email" class="form-control" required maxlength="100" autocomplete="email" aria-describedby="error-correo-reg">
                        <div id="error-correo-reg" class="invalid-feedback" aria-live="polite">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="pass-reg" class="form-label">
                            Contraseña
                        </label>
                        <input id="pass-reg" name="pass-reg" type="password" class="form-control" required minlength="4" maxlength="10" autocomplete="new-password" aria-describedby="error-pass-reg">
                        <div id="error-pass-reg" class="invalid-feedback" aria-live="polite">
                        </div>
                    </div>
                    <p class="small text-muted">
                        Usa de 4 a 10 caracteres. Correos admitidos: @duoc.cl, @profesor.duoc.cl y @gmail.com.
                    </p>
                    <div class="mb-3">
                        <label for="pass-conf" class="form-label">
                            Confirmar contraseña
                        </label>
                        <input id="pass-conf" name="pass-conf" type="password" class="form-control" required autocomplete="new-password" aria-describedby="error-pass-conf">
                        <div id="error-pass-conf" class="invalid-feedback" aria-live="polite">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="telefono" class="form-label">
                            Teléfono (opcional)
                        </label>
                        <input id="telefono" name="telefono" type="tel" class="form-control" autocomplete="tel" maxlength="20" aria-describedby="error-telefono">
                        <div id="error-telefono" class="invalid-feedback" aria-live="polite">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="region" class="form-label">
                            Región
                        </label>
                        <select id="region" class="form-select">
                            <option>
                                Región Metropolitana
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="comuna" class="form-label">
                            Comuna
                        </label>
                        <select id="comuna" class="form-select">
                            <option>
                                Santiago
                            </option>
                            <option>
                                Providencia
                            </option>
                        </select>
                    </div>
                    <div id="estado-registro" role="status" class="mb-3">
                    </div>
                    <button type="submit" class="btn btn-danger w-100 fw-bold">
                        Crear cuenta
                    </button>
                </form>
                <p class="text-center mt-3">
                    ¿Ya tienes cuenta?
                    <a href="login.html">
                        Iniciar sesión
                    </a>
                </p>
            </div>
        </main>
        <script src="scripts/registro.js">
        </script>
        <script src="scripts/navegacion.js">
        </script>
    </body>
</html>
